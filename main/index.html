<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>

    <link rel="stylesheet" href="../_shared/common.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.0/dist/axios.min.js"></script>
    <script src="../_shared/deps/reconnecting-websocket.min.js"></script>
    <script src="../_shared/deps/countUp.js"></script>
</head>
<body>
    <div class="main">
        <!-- Logo -->
        <img class="logo" src="static/logo.png">

        <!-- Team Flags -->
        <img class="team-flag left-team-flag" id="left-team-flag" src="../flags/transparent.png">
        <img class="team-flag right-team-flag" id="right-team-flag" src="../flags/transparent.png">
    
        <!-- Team Name -->
        <div class="team-name left-team-name" id="left-team-name"></div>
        <div class="team-name right-team-name" id="right-team-name"></div>
    
        <!-- Star Containers -->
        <div class="team-star-container left-team-star-container" id="left-team-star-container"></div>
        <div class="team-star-container right-team-star-container" id="right-team-star-container"></div>

        <!-- Logo and title -->
        <div class="middle-section round-name-container" id="round-name-container"><span id="round-name"></span> - <span class="league-name" id="league-name">MAJOR LEAGUE</span></div>

        <!-- Now Playing Section -->
        <div class="middle-section middle-now-playing-section" id="now-playing-section">
            <img class="now-playing-section-dial" src="../_shared/assets/dial-no-arrow.png">
            <div class="now-playing-section-details" id="now-playing-section-details">
                <div class="now-playing-section-details-overlay"></div>
                <div class="now-playing-metadata">
                    <div class="now-playing-metadata-text now-playing-metadata-title" id="now-playing-song-title"></div>
                    <div class="now-playing-metadata-text now-playing-metadata-artist" id="now-playing-song-artist"></div>
                </div>
                <div class="now-playing-stats">
                    <div class="now-playing-stats-item now-playing-stats-sr">SR: <span id="stats-sr"></span></div>
                    <div class="now-playing-stats-item">LENGTH: <span id="stats-length"></span></div>
                    <div class="now-playing-stats-item">AR: <span id="stats-ar"></span></div>
                    <div class="now-playing-stats-item">HP: <span id="stats-hp"></span></div>
                    <div class="now-playing-stats-item">BPM: <span id="stats-bpm"></span></div>
                    <div class="now-playing-stats-item">CS: <span id="stats-cs"></span></div>
                    <div class="now-playing-stats-item">OD: <span id="stats-od"></span></div>
                </div>
            </div>
        </div>

        <!-- Scores -->
        <div class="scores-container" id="scores-container">
            <div class="score-bar score-bar-left" id="score-bar-left"></div>
            <div class="score-bar score-bar-right" id="score-bar-right"></div>
            <div class="score score-left" id="score-left"></div>
            <div class="score score-right" id="score-right"></div>
            <div class="score score-difference" id="score-difference-number"></div>
            <img class="score-dial" id="score-dial" src="static/dial-arrow.png">
        </div>

        <!-- Chat Display -->
        <div class="chat-display" id="chat-display">
            <img class="chat-display-title" src="../_shared/assets/live-chat.png">
            <div class="chat-display-border" id="chat-display-border"></div>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
